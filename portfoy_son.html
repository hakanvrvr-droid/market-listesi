<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tasarruf Defteri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap">
<style>
/* Layout: tek sütun, telefon odaklı. Üstte başlık, ortada ekran, altta dört sekmeli gezinme.
   Özet ekranı: toplam bandı, iki kişilik kartlar, dağılım tablosu. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#F4F6F8; --ink:#14212B; --muted:#586976; --line:#D8DFE5;
  --accent:#1D3A5F; --accent-ink:#FFFFFF; --accent-soft:#DDE7F2;
  --hero-bg:#1D3A5F; --hero-ink:#FFFFFF; --hero-muted:#B8C9DC;
  --pa:#0F8B8D; --pb:#C2561F; --pc:#6A4C93;
  --good:#1B7A4B; --good-soft:#DCF1E5; --warn:#8F5E00; --warn-soft:#FBEBC8; --bad:#B0352D; --bad-soft:#F9DFDC;
  --wa:#11803F;
  --scrim:rgba(10,20,28,.5);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E161C; --surface:#16212A; --surface2:#1C2933; --ink:#E7EDF1; --muted:#94A4B0; --line:#263641;
  --accent:#8DBBE6; --accent-ink:#0B1A28; --accent-soft:#1B3344;
  --hero-bg:#1B3350; --hero-ink:#F2F6FA; --hero-muted:#A5BBD1;
  --pa:#4FC3C5; --pb:#F0925A; --pc:#B79CE8;
  --good:#5FD39A; --good-soft:#143328; --warn:#E8B25A; --warn-soft:#3A2C12; --bad:#F08A82; --bad-soft:#3D1D1B;
  --wa:#1E9E55;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161C; --surface:#16212A; --surface2:#1C2933; --ink:#E7EDF1; --muted:#94A4B0; --line:#263641;
  --accent:#8DBBE6; --accent-ink:#0B1A28; --accent-soft:#1B3344;
  --hero-bg:#1B3350; --hero-ink:#F2F6FA; --hero-muted:#A5BBD1;
  --pa:#4FC3C5; --pb:#F0925A; --pc:#B79CE8;
  --good:#5FD39A; --good-soft:#143328; --warn:#E8B25A; --warn-soft:#3A2C12; --bad:#F08A82; --bad-soft:#3D1D1B;
  --wa:#1E9E55;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tbl,.kv b,.hero-n,.pn{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.01em}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
main{display:grid;gap:16px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.loading{color:var(--muted);padding:32px 0;text-align:center}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:10px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;min-height:52px;align-content:center;white-space:nowrap}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:18px;padding:18px 18px 16px;display:grid;gap:4px}
.hero .eyebrow{color:var(--hero-muted)}
.hero-n{font-family:var(--f-display);font-size:clamp(34px,10vw,46px);font-weight:700;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.hero-n span{font-size:.55em;font-weight:600;margin-left:4px;color:var(--hero-muted)}
.hero-s{font-size:13px;color:var(--hero-muted)}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.people.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.people.three .pcard{padding:10px 10px}
.people.three .pn{font-size:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;display:grid;gap:2px}
.pname{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-width:0}
.pname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.psub{font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.share{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface2);margin-top:-4px}
.share i{display:block;height:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.card h2,.sec-h h2{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:-.01em}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.scroll-x{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 0 8px 8px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl td{text-align:right;padding:9px 0 9px 8px;border-top:1px solid var(--line);white-space:nowrap}
.tbl td:first-child{white-space:normal;color:var(--muted);font-weight:500}
.tbl tr.tot td{font-weight:700;color:var(--ink);border-top:2px solid var(--ink)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.small{font-size:12px;color:var(--muted)}

.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.note{border-radius:12px;padding:10px 12px;font-size:13px;background:var(--surface2);color:var(--ink)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.who{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;min-width:0}

.btn{font-weight:600;font-size:14px;padding:10px 14px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.wa svg{width:20px;height:20px;flex:none}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:13px}
.btn.ghost{background:transparent}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.sendbar{display:grid;margin-top:4px}
.sendbar .btn{width:100%}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;border:1px solid var(--line)}
.seg label,.seg button{position:relative;min-width:0}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span,.seg button{display:block;text-align:center;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:transparent;width:100%}
.seg input:checked+span,.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}

.bank{display:grid;gap:8px}
.bank-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 2px}
.bank-h h3{font-family:var(--f-display);font-size:16px;font-weight:700;overflow-wrap:anywhere}
.bank-h .small{text-align:right}
.dep,.lot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.dep.due{border-color:var(--bad)}
.dep-top,.lot-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dep-amt,.lot-n{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.dep-amt small,.lot-n small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.kv div{display:grid;gap:1px;min-width:0}
.kv span{font-size:12px;color:var(--muted)}
.kv b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.prog{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.prog.due i{background:var(--bad)}
.hist{border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:4px;font-size:12px;color:var(--muted)}
.alert{border-color:var(--bad)}
.alert-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.alert-h b{color:var(--bad);font-family:var(--f-display);font-size:16px}
.stack{display:grid;gap:10px}
.up{display:grid;gap:0;list-style:none;margin:0;padding:0}
.up li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.up li:first-child{border-top:0;padding-top:0}
.up .l{display:grid;gap:2px;min-width:0}
.up .l b{overflow-wrap:anywhere}
.up .r{display:grid;gap:4px;justify-items:end;text-align:right}
.empty{text-align:center;padding:22px 16px;display:grid;gap:10px;justify-items:center}
.empty p{color:var(--muted);max-width:34ch}

details.prices>summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.prices>summary::-webkit-details-marker{display:none}
details.prices>summary::after{content:"+";font-size:20px;color:var(--muted)}
details.prices[open]>summary::after{content:"−"}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

.fld{display:grid;gap:6px;min-width:0}
.fld>label,.fld>.lbl{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select{font:inherit;font-size:16px;padding:10px 12px;min-height:44px;width:100%;min-width:0;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.echo{font-size:12px;color:var(--muted);min-height:16px}
.echo.err{color:var(--bad)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.chk input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.prev{border-radius:12px;background:var(--surface2);padding:10px 12px;font-size:13px;min-height:40px}
.tbl.sticky td:first-child,.tbl.sticky th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;padding-right:8px}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl tr[data-act]{cursor:pointer}
.tbl tr.sel td:first-child{color:var(--ink);font-weight:700}
.acc{border-top:1px solid var(--line)}
.acc:first-child{border-top:0}
.acc-h{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;background:none;border:0;padding:12px 0;min-height:52px;cursor:pointer;text-align:left;color:var(--ink)}
.acc-l{display:grid;gap:2px;min-width:0}
.acc-l b{font-family:var(--f-display);font-size:16px}
.acc-r{display:flex;align-items:center;gap:8px;flex:none}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .15s}
.acc-h[aria-expanded="true"] .chev{transform:rotate(180deg)}
.acc-b{padding-bottom:6px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.formerr{color:var(--bad);font-size:13px;font-weight:600;min-height:18px}
.static{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--surface2);border-radius:12px;padding:10px 12px}
.rep{white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,Menlo,Consolas,'Courier New',monospace;font-size:12px;line-height:1.5;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:48vh;overflow:auto}

.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--scrim)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head h2{font-family:var(--f-display);font-size:20px;font-weight:700}
.sheet-body{display:grid;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;max-width:min(92vw,480px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;text-align:center}
.toast.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){.sheet-panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Tasarruf Defteri</h1><span id="mode" class="chip"></span></div>
    <button class="icon-btn" data-act="settings" aria-label="Ayarlar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<nav class="nav" aria-label="Ana gezinme"><div class="tabs">
  <a class="tab" id="t-ozet" href="#ozet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Özet</a>
  <a class="tab" id="t-vadeli" href="#vadeli"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Vadeli</a>
  <a class="tab" id="t-nakit" href="#nakit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>Nakit</a>
  <a class="tab" id="t-akis" href="#akis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Nakit Akış</a>
  <a class="tab" id="t-altin" href="#altin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="6"/><path d="M15 9.5a6 6 0 1 1-5.5 8.5"/></svg>Altın/Döviz</a>
</div></nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-act="sheet-close"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon-btn" data-act="sheet-close" aria-label="Kapat">&#x2715;</button></div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');

/* ---------- sabitler ---------- */
const SYM={TRY:'₺',USD:'$',EUR:'€',GBP:'£',CHF:'CHF'};
const FXC=['USD','EUR','GBP','CHF'];
const INSTR=[
  {k:'USD',n:'Dolar',g:'fx',u:'$'},{k:'EUR',n:'Euro',g:'fx',u:'€'},{k:'GBP',n:'Sterlin',g:'fx',u:'£'},{k:'CHF',n:'İsviçre frangı',g:'fx',u:'CHF'},
  {k:'GA24',n:'Gram altın (24 ayar)',g:'gold',u:'gr'},{k:'GA22',n:'22 ayar bilezik',g:'gold',u:'gr'},
  {k:'CEYREK',n:'Çeyrek altın',g:'gold',u:'adet'},{k:'YARIM',n:'Yarım altın',g:'gold',u:'adet'},{k:'TAM',n:'Tam altın',g:'gold',u:'adet'}
];
const IB=Object.fromEntries(INSTR.map(i=>[i.k,i]));

/* ---------- biçim ---------- */
const nf0=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0,useGrouping:'always'});
const nf2=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:'always'});
const nfq=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:4,useGrouping:'always'});
const fmt0=n=>nf0.format(Math.round(n)+0);
const fmt2=n=>nf2.format(n+0);
const money=(n,c,dec)=>(dec===0?fmt0(n):fmt2(n))+' '+SYM[c];
const signed=(n,dec)=>{dec=dec||0;const z=Math.abs(n)<(dec===0?0.5:0.005);const a=Math.abs(n);return (z?'':n>0?'+':'−')+(dec===0?fmt0(a):fmt2(a));};
const plCls=n=>Math.abs(n)<0.5?'':n>0?'pos':'neg';
const numStr=n=>(n===''||n==null||isNaN(n))?'':String(n).replace('.',',');
function parseNum(s){
  if(s==null)return NaN;
  s=String(s).trim().replace(/[\s ]/g,'').replace(/[₺$€£]|TL|TRY/gi,'');
  if(!s)return NaN;
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
  else if(/^[1-9]\d{0,2}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=Number(s);return isFinite(n)?n:NaN;
}

/* ---------- tarih ---------- */
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};
const parseD=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12);};
const validD=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!isNaN(parseD(s));
const fmtD=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'';
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);

function fail(e){
  const c=e&&e.code;
  if(c==='invalid_argument')toast('Kaydedilemedi. Düzenlemek için sayfada “Katkıda bulunan” veya daha yüksek yetki gerekir.','bad');
  else if(c==='quota_exceeded')toast('Kayıt sınırı doldu. Eski kayıtları silip tekrar dene.','bad');

}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

async function putDoc(coll,rec){
  const list=listOf(coll),i=list.findIndex(x=>x.id===rec.id);
  if(i>=0)list[i]=rec;else list.push(rec);
  render();

  else lsSave();
}
async function delDoc(coll,id){
  const list=listOf(coll),i=list.findIndex(x=>x.id===id);
  if(i>=0)list.splice(i,1);

}

/* ---------- hesaplar ---------- */
const isArch=d=>d.status==='closed'||(!!d.autoClose&&d.endDate<=todayStr());
const isDue=d=>!isArch(d)&&d.endDate<=todayStr();
const activeDeps=()=>state.deposits.filter(d=>!isArch(d));
const byEnd=(a,b)=>a.endDate<b.endDate?-1:a.endDate>b.endDate?1:0;
function rateOf(c){if(c==='TRY')return 1;const p=Number(state.settings.prices[c]);return p>0?p:null;}
function priceOf(k){const p=Number(state.settings.prices[k]);return p>0?p:null;}
function assetVal(a){const p=priceOf(a.k);return p?a.qty*p:a.cost;}
function cashTL(c){const r=rateOf(c.cur);return r?c.amount*r:0;}
function summarize(owner){
  const s={depTRY:0,depFX:{},depFXtl:0,gold:0,fx:0,cash:0,cost:0,val:0,missing:new Set(),nPrice:new Set(),nDep:0,goldPL:0,fxPL:0,depGain:0,fxBy:{}};
  for(const d of activeDeps()){
    if(owner!=='all'&&d.owner!==owner)continue;
    s.nDep++;
    const gn=d.maturity-d.principal;
    if(d.cur==='TRY'){s.depTRY+=d.maturity;s.depGain+=gn;}
    else{
      s.depFX[d.cur]=(s.depFX[d.cur]||0)+d.maturity;
      const r=rateOf(d.cur),f=s.fxBy[d.cur]||(s.fxBy[d.cur]={tl:0,native:0});f.native+=d.maturity;
      if(r){s.depFXtl+=d.maturity*r;f.tl+=d.maturity*r;s.depGain+=gn*r;}else s.missing.add(d.cur);
    }
  }
  for(const c of state.cash){
    if(owner!=='all'&&c.owner!==owner)continue;
    if(rateOf(c.cur))s.cash+=cashTL(c);else s.missing.add(c.cur);
  }
  for(const a of state.assets){
    if(owner!=='all'&&a.owner!==owner)continue;
    const v=assetVal(a);if(!priceOf(a.k))s.nPrice.add(a.k);
    const pl0=v-a.cost;
    if(IB[a.k]&&IB[a.k].g==='gold'){s.gold+=v;s.goldPL+=pl0;}
    else{s.fx+=v;s.fxPL+=pl0;const f=s.fxBy[a.k]||(s.fxBy[a.k]={tl:0,native:0});f.native+=a.qty;f.tl+=v;}
    s.cost+=a.cost;s.val+=v;
  }
  s.pl=s.val-s.cost;s.totalPL=s.pl+s.depGain;s.total=s.depTRY+s.depFXtl+s.cash+s.gold+s.fx;
  return s;
}

/* ---------- görünüm yardımcıları ---------- */
const nm=o=>state.settings.names[o];
const hasHome=()=>state.deposits.some(x=>x.owner==='c')||state.cash.some(x=>x.owner==='c')||state.assets.some(x=>x.owner==='c');
const ownCols=()=>hasHome()?['a','b','c']:['a','b'];
const who=o=>`<span class="who"><i class="dot" style="background:var(--p${o})"></i><span>${esc(nm(o))}</span></span>`;
const chip=(c,t)=>`<span class="chip ${c}">${t}</span>`;
const pctStr=n=>n.toFixed(2).replace('.',',');
function dueChip(d){
  const n=diffDays(todayStr(),d.endDate);
  if(n<0)return chip('bad',`Vadesi ${-n} gün önce doldu`);
  if(n===0)return chip('bad','Vade bugün');
  if(n<=7)return chip('warn',n+' gün kaldı');
  return chip('',n+' gün kaldı');
}
function dueText(d){
  const n=diffDays(todayStr(),d.endDate);
  if(n<0)return `vadesi ${-n} gün önce doldu`;
  if(n===0)return 'vade bugün';
  return n+' gün kaldı';
}
function sumsByCur(list,f){
  const o={};for(const d of list)o[d.cur]=(o[d.cur]||0)+(Number(d[f])||0);
  const keys=['TRY'].concat(FXC).filter(c=>o[c]!=null);
  return keys.length?keys.map(c=>money(o[c],c,0)).join('<br>'):'—';
}
function sumsLine(list,f){
  const o={};for(const d of list)o[d.cur]=(o[d.cur]||0)+(Number(d[f])||0);
  return ['TRY'].concat(FXC).filter(c=>o[c]!=null).map(c=>money(o[c],c,0)).join(' · ');
}
const bankKey=b=>String(b).trim().toLocaleLowerCase('tr');
function groupByBank(list){
  const groups=new Map();
  for(const d of list){const k=bankKey(d.bank);if(!groups.has(k))groups.set(k,{name:d.bank.trim(),list:[]});groups.get(k).list.push(d);}
  return [...groups.values()];
}

function depActions(d){
  if(ui.confirmClose===d.id)
    return `<div class="note">Bu hesap toplamlardan çıkarılıp arşive taşınacak. Devam edilsin mi?</div>

  const due=isDue(d);
  return `<div class="acts">
    <button class="btn ${due?'pri ':''}sm" data-act="renew" data-id="${d.id}">${due?'Vadeyi uzat':'Uzat'}</button>
    ${due?`<button class="btn bad sm" data-act="close-ask" data-id="${d.id}">Bankadan çıkar</button>`:''}
    <button class="btn ghost sm" data-act="edit-dep" data-id="${d.id}">Düzenle</button></div>`;
}
function gainLine(d){
  const g=d.maturity-d.principal,gp=d.principal>0?g/d.principal*100:0,ann=d.termDays>0?gp/d.termDays*365:0;
  return `Net getiri <b class="${plCls(g)}">${signed(g,2)} ${SYM[d.cur]}</b> · %${pctStr(gp)} vade · yıllık ≈ %${ann.toFixed(1).replace('.',',')}`;
}
function depRow(d){
  const t=todayStr(),due=isDue(d),total=Math.max(1,diffDays(d.startDate,d.endDate));
  const pct=Math.round(Math.min(total,Math.max(0,diffDays(d.startDate,t)))/total*100);

  if(d.autoClose)h+=`<p class="small">Vade günü toplamlardan otomatik düşecek.</p>`;
  if(hs.length){
    h+=`<div><button class="btn ghost sm" data-act="hist" data-id="${d.id}">${ui.hist.has(d.id)?'Önceki vadeleri gizle':`Önceki vadeler (${hs.length})`}</button></div>`;
    if(ui.hist.has(d.id))h+=`<div class="hist">${hs.slice().reverse().map(r=>`<div>${fmtD(r.startDate)} → ${fmtD(r.endDate)} · ${money(r.principal,d.cur)} → ${money(r.maturity,d.cur)}</div>`).join('')}</div>`;
  }
  return h+depActions(d)+`</article>`;
}
function dueCard(d){
  return `<article class="card alert">
    <div class="alert-h"><b>Vadesi doldu</b>${dueChip(d)}</div>

}

/* ---------- WhatsApp raporu ---------- */
const TLs=n=>fmt0(n)+' ₺';
const sgn=n=>signed(n)+' ₺';
function repHead(t){return '*Tasarruf Defteri · '+t+'*\n'+fmtD(todayStr())+'\n';}
function filtName(o){return o==='all'?'':' · '+nm(o);}
function repMissing(S){
  let t='';
  if(S.missing.size)t+='\n_Not: '+[...S.missing].join(', ')+' kuru girilmediği için bu dövizdeki hesaplar toplama dahil değil._\n';
  return t;
}
function repHome(){
  const A=summarize('a'),B=summarize('b'),T=summarize('all');
  let t=repHead('Özet')+'\n*Toplam tasarruf:* '+TLs(T.total)+'\n';
  for(const o of ownCols())t+='• '+nm(o)+': '+TLs(summarize(o).total)+'\n';
  t+='\n*Dağılım*\n';
  const lines=[['Vadeli TL',T.depTRY],['Vadeli döviz (₺ karşılığı)',T.depFXtl],['Nakit',T.cash],['Altın',T.gold],['Elde döviz',T.fx]];
  for(const l of lines)if(Math.abs(l[1])>=0.5)t+='• '+l[0]+': '+TLs(l[1])+'\n';
  t+='\n*Kâr / zarar*\n• Vadeli kazanç: '+sgn(T.depGain)+'\n• Altın: '+sgn(T.goldPL)+'\n• Döviz: '+sgn(T.fxPL)+'\n• Toplam: '+sgn(T.totalPL)+'\n';
  const due=activeDeps().filter(isDue).sort(byEnd);
  if(due.length){t+='\n*Vadesi dolanlar*\n';for(const d of due)t+='• '+d.bank+' ('+nm(d.owner)+'): '+money(d.maturity,d.cur,0)+' · '+dueText(d)+'\n';}
  const soon=activeDeps().filter(d=>!isDue(d)).sort(byEnd).slice(0,4);
  if(soon.length){t+='\n*Yaklaşan vadeler*\n';for(const d of soon)t+='• '+fmtD(d.endDate)+' · '+d.bank+' ('+nm(d.owner)+'): '+money(d.maturity,d.cur,0)+' · '+dueText(d)+'\n';}
  return (t+repMissing(T)).trim();
}
function repDeposits(){
  const act=activeDeps().filter(d=>ui.depOwner==='all'||d.owner===ui.depOwner).sort(byEnd);
  let t=repHead('Vadeli hesaplar'+filtName(ui.depOwner));
  if(!act.length)return t+'\nVadeli hesap yok.';
  t+='\n*Toplam bağlı:* '+sumsLine(act,'principal')+'\n*Vade sonunda:* '+sumsLine(act,'maturity')+'\n';
  for(const g of groupByBank(act)){
    t+='\n*'+g.name+'*\n';
    for(const d of g.list){
      const gn=d.maturity-d.principal;
      t+='• '+nm(d.owner)+': '+money(d.principal,d.cur,0)+' → '+money(d.maturity,d.cur,0)+' (net '+signed(gn,2)+' '+SYM[d.cur]+')\n   '+fmtD(d.startDate)+' – '+fmtD(d.endDate)+' · '+d.termDays+' gün · '+dueText(d)+'\n';
    }
  }
  return t.trim();
}
function repCash(){
  const list=state.cash.filter(c=>ui.cashOwner==='all'||c.owner===ui.cashOwner);
  let t=repHead('Nakit'+filtName(ui.cashOwner));
  if(!list.length)return t+'\nNakit kaydı yok.';
  const totTL=list.reduce((s,c)=>s+cashTL(c),0),miss=[...new Set(list.filter(c=>!rateOf(c.cur)).map(c=>c.cur))];
  t+='\n*Toplam nakit:* '+sumsLine(list,'amount')+'\n*₺ karşılığı:* '+TLs(totTL)+'\n';
  for(const g of groupByBank(list)){
    t+='\n*'+g.name+'* ('+sumsLine(g.list,'amount')+')\n';
    for(const c of g.list)t+='• '+nm(c.owner)+': '+money(c.amount,c.cur)+(c.note?' ('+c.note+')':'')+'\n';
  }
  if(miss.length)t+='\n_Not: '+miss.join(', ')+' kuru girilmediği için ₺ karşılığına dahil değil._\n';
  return t.trim();
}
function repAssets(){
  const list=state.assets.filter(a=>ui.asOwner==='all'||a.owner===ui.asOwner);
  let t=repHead('Altın / Döviz'+filtName(ui.asOwner));
  if(!list.length)return t+'\nKayıt yok.';
  const S=summarize(ui.asOwner);
  t+='\n*Maliyet:* '+TLs(S.cost)+'\n*Güncel değer:* '+TLs(S.val)+'\n*Kâr/zarar:* '+sgn(S.pl)+'\n\n*Pozisyonlar*\n';
  const pos=new Map();
  for(const a of list){const p=pos.get(a.k)||{k:a.k,qty:0,cost:0,val:0};p.qty+=a.qty;p.cost+=a.cost;p.val+=assetVal(a);pos.set(a.k,p);}
  for(const p of pos.values()){
    const i=IB[p.k]||{n:p.k,u:''},pl=p.val-p.cost,pp=p.cost>0?pl/p.cost*100:0;
    t+='• '+i.n+': '+nfq.format(p.qty)+' '+i.u+' · değer '+TLs(p.val)+' · '+sgn(pl)+' ('+(pl<0?'−':pl>0?'+':'')+'%'+pctStr(Math.abs(pp))+')\n';
  }
  const pr=INSTR.filter(i=>priceOf(i.k));
  if(pr.length){t+='\n*Kullanılan güncel fiyatlar*\n';for(const i of pr)t+='• '+i.n+': '+fmt2(priceOf(i.k))+' ₺\n';}
  if(S.nPrice.size)t+='\n_Not: '+[...S.nPrice].map(k=>IB[k]?IB[k].n:k).join(', ')+' için güncel fiyat girilmedi, alış tutarıyla hesaplandı._\n';
  return t.trim();
}
function buildReport(v){return v==='vadeli'?repDeposits():v==='nakit'?repCash():v==='akis'?repFlow():v==='altin'?repAssets():repHome();}

function waSend(){
  const sh=ui.sheet;if(!sh||sh.type!=='report')return;

async function waCopy(){
  const sh=ui.sheet;if(!sh||sh.type!=='report')return;

  catch(e){
    try{const ta=document.createElement('textarea');ta.value=sh.text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Rapor kopyalandı.');}

let pending=false;
function render(){
  const v=$('#view'),act=document.activeElement;
  if(act&&act!==document.body&&v.contains(act)&&act.matches('input')){pending=true;return;}
  pending=false;
  const m=$('#mode');
  if(state.mode==='shared'){m.className='chip good';m.textContent='Ortak kayıt';m.title='Kayıtlar sayfaya erişimi olan herkesle ortak ve canlı';}
  else{m.className='chip warn';m.textContent='Yalnızca bu cihaz';m.title='Kayıtlar bu tarayıcıda tutuluyor';}
  for(const k of ['ozet','vadeli','nakit','akis','altin']){const t=$('#t-'+k);if(ui.view===k)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');}
  if(!state.ready){v.innerHTML='<p class="loading">Kayıtlar yükleniyor…</p>';return;}
  v.innerHTML=(ui.view==='vadeli'?viewDeposits():ui.view==='nakit'?viewCash():ui.view==='akis'?viewFlow():ui.view==='altin'?viewAssets():viewHome())+sendBar();
  if(!ui.namesPrompted&&!state.settings.namesSet){
    ui.namesPrompted=true;let skip=false;try{skip=localStorage.getItem(LS+'-skipnames')==='1';}catch(e){}
    if(!skip)openSettings(true);
  }
}

  const el=$('#'+eid),raw=val(iid).trim();

function updDep(){
  const cur=depCur();

  echo('e-principal','f-principal',cur);echo('e-mat','f-mat',cur);

/* ---------- NAKİT AKIŞ ---------- */
const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const monthLbl=ym=>MONTHS[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
const addMonths=(ym,n)=>{let y=+ym.slice(0,4),m=+ym.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+p2(m+1);};
const monthEnd=ym=>{const y=+ym.slice(0,4),m=+ym.slice(5,7);return ym+'-'+p2(new Date(y,m,0).getDate());};
const addMonthsDate=(s,n)=>{const ym=addMonths(s.slice(0,7),n),d=Math.min(+s.slice(8,10),+monthEnd(ym).slice(8,10));return ym+'-'+p2(d);};
const FTYPES=[{k:'vade',n:'Vade geliri',s:'Vade'},{k:'emekli',n:'Emekli maaşı',s:'Emekli'},{k:'kira',n:'Kira geliri',s:'Kira'},{k:'maas',n:'Maaş tasarrufu',s:'Maaş'},{k:'prim',n:'Prim',s:'Prim'}];
const FT=Object.fromEntries(FTYPES.map(t=>[t.k,t]));
const fmtA=n=>Math.abs(n-Math.round(n))<0.005?fmt0(n):fmt2(n);
function flowCalc(owner){
  const today=todayStr(),cm=today.slice(0,7),base=summarize(owner).total;
  const list=state.flows.filter(f=>(owner==='all'||f.owner===owner)&&f.date>=today).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const by=new Map();
  for(const f of list){const ym=f.date.slice(0,7);let m=by.get(ym);if(!m){m={ym,t:{},total:0};by.set(ym,m);}m.t[f.type]=(m.t[f.type]||0)+f.amount;m.total+=f.amount;}
  const rows=[...by.values()].sort((a,b)=>a.ym<b.ym?-1:1);
  let cum=base;for(const r of rows){cum+=r.total;r.bal=cum;}
  return{base,list,rows,cm};
}
function flowSel(c){let ym=ui.flowMonth||c.cm;if(ym<c.cm)ym=c.cm;return ym;}
function flowUpTo(c,ym){
  const end=monthEnd(ym),t={};let add=0;
  for(const f of c.list)if(f.date<=end){t[f.type]=(t[f.type]||0)+f.amount;add+=f.amount;}
  return{add,t};
}
function viewFlow(){
  const o=ui.flowOwner,c=flowCalc(o),ym=flowSel(c),u=flowUpTo(c,ym);
  let h=`<div class="sec-h"><h2>Nakit akış</h2><button class="btn pri sm" data-act="add-flow">+ Ekle</button></div>${ownerSeg('flowOwner')}`;
  if(state.note)h+=`<div class="note warn">${esc(state.note)}</div>`;
  const last=c.rows.length?c.rows[c.rows.length-1].ym:c.cm,endM=last>addMonths(c.cm,23)?last:addMonths(c.cm,23);
  let opts='';for(let m=c.cm;m<=endM;m=addMonths(m,1))opts+=`<option value="${m}"${m===ym?' selected':''}>${monthLbl(m)}</option>`;
  h+=`<div class="fld"><label for="flow-month">Hangi ayın sonundaki tasarrufu görmek istiyorsun?</label><select id="flow-month">${opts}</select></div>
    <section class="hero"><p class="eyebrow">${monthLbl(ym)} sonu toplam tasarruf</p>
    <p class="hero-n">${fmt0(c.base+u.add)}<span>₺</span></p>
    <p class="hero-s">Mevcut bakiye ${fmt0(c.base)} ₺ + girilen gelirler ${fmt0(u.add)} ₺</p></section>
    <p class="small">Mevcut bakiye, Özet sayfasındaki toplamdır. Vadeli hesaplarının vade sonu değeri bu toplama zaten dahildir. Yalnızca bugünden ileri tarihli gelirler eklenir.</p>`;
  if(!state.flows.length){
    h+=`<section class="card empty"><h2>Henüz gelir girilmedi</h2><p>Vade geliri, emekli maaşı, kira, maaş tasarrufu veya prim gibi gelecekte alacağın tutarları tarihiyle ekle. Aylık tekrar eden gelirleri tek seferde girebilirsin.</p><button class="btn pri" data-act="add-flow">Gelir ekle</button></section>`;
    return h;
  }
  const tk=FTYPES.filter(t=>u.t[t.k]);
  if(tk.length)h+=`<section class="card"><h2>${monthLbl(ym)} sonuna kadar eklenen gelirler</h2><div class="scroll-x"><table class="tbl"><thead><tr><th>Tür</th><th>Tutar</th></tr></thead><tbody>
    ${tk.map(t=>`<tr><td>${t.n}</td><td>${fmt0(u.t[t.k])}</td></tr>`).join('')}
    <tr class="tot"><td>Toplam</td><td>${fmt0(u.add)}</td></tr></tbody></table></div><p class="small">Tutarlar ₺ cinsinden.</p></section>`;
  if(c.rows.length){
    const cols=FTYPES.filter(t=>c.rows.some(r=>r.t[t.k]));
    const tot={};for(const t of cols)tot[t.k]=c.rows.reduce((s,r)=>s+(r.t[t.k]||0),0);
    const all=c.rows.reduce((s,r)=>s+r.total,0);
    h+=`<section class="card"><h2>Aylara ve türlere göre</h2><div class="scroll-x"><table class="tbl sticky"><thead><tr><th>Ay</th>${cols.map(t=>`<th>${t.s}</th>`).join('')}<th>Toplam</th><th>Ay sonu bakiye</th></tr></thead><tbody>
      ${c.rows.map(r=>`<tr data-act="flow-month" data-v="${r.ym}"${r.ym===ym?' class="sel"':''}><td>${monthLbl(r.ym)}</td>${cols.map(t=>`<td>${r.t[t.k]?fmt0(r.t[t.k]):'—'}</td>`).join('')}<td>${fmt0(r.total)}</td><td>${fmt0(r.bal)}</td></tr>`).join('')}
      <tr class="tot"><td>Toplam</td>${cols.map(t=>`<td>${fmt0(tot[t.k])}</td>`).join('')}<td>${fmt0(all)}</td><td>${fmt0(c.base+all)}</td></tr></tbody></table></div>
      <p class="small">Tutarlar ₺ cinsinden. Ay sonu bakiye, mevcut bakiye üzerine o aya kadarki tüm gelirler eklenerek hesaplanır. Bir aya dokunursan üstteki toplam o ayı gösterir.</p></section>`;
  }
  const today=todayStr();
  const lst=state.flows.filter(f=>o==='all'||f.owner===o).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const entry=f=>`<li>
      <div class="l"><b>${esc((FT[f.type]||{n:f.type}).n)}</b><span class="small">${fmtD(f.date)} · ${who(f.owner)}${f.note?' · '+esc(f.note):''}</span></div>
      <div class="r"><b class="num">${fmtA(f.amount)} ₺</b>${f.date<today?chip('','Geçmiş, toplama dahil değil'):''}<button class="btn ghost sm" data-act="edit-flow" data-id="${f.id}">Düzenle</button></div></li>`;
  if(lst.length){
    const gm=new Map();

/* --- görselden fiyat okuma (OCR) --- */
const OCR_MAP={USD:'USD',EUR:'EUR',GBP:'GBP',CHF:'CHF',XAU:'GA24'};
const OCR_LIB='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const OCR_LANG='https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng/4.0.0_best_int';
function loadOcrLib(){
  if(window.Tesseract)return Promise.resolve();
  return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=OCR_LIB;sc.onload=()=>res();sc.onerror=()=>rej(new Error('lib'));document.head.appendChild(sc);});
}
function loadImg(file){
  return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u);res(im);};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'));};im.src=u;});
}
function prepCanvas(im,mode){
  const w0=im.naturalWidth,h0=im.naturalHeight;
  let sc=Math.min(3,Math.max(1,1600/w0));if(w0*sc>2400)sc=2400/w0;
  if(w0*h0*sc*sc>6e6)sc=Math.sqrt(6e6/(w0*h0));
  const c=document.createElement('canvas');c.width=Math.round(w0*sc);c.height=Math.round(h0*sc);
  const x=c.getContext('2d',{willReadFrequently:true});
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  if(mode==='btn'){
    /* Mavi butonların içindeki beyaz yazıyı ayır: dıştan ulaşılamayan, mavi olmayan pikseller yazıdır. */
    const w=c.width,h=c.height,n=w*h,blue=new Uint8Array(n),seen=new Uint8Array(n),st=new Int32Array(n);
    let sp=0;
    for(let i=0,j=0;i<n;i++,j+=4){if(p[j]<120&&p[j+2]-p[j]>50)blue[i]=1;}
    const push=i=>{if(!blue[i]&&!seen[i]){seen[i]=1;st[sp++]=i;}};
    for(let xx=0;xx<w;xx++){push(xx);push((h-1)*w+xx);}
    while(sp){const i=st[--sp],xx=i%w;if(xx>0)push(i-1);if(xx<w-1)push(i+1);if(i>=w)push(i-w);if(i<n-w)push(i+w);}
    for(let i=0,j=0;i<n;i++,j+=4){const v=(!blue[i]&&!seen[i])?0:255;p[j]=p[j+1]=p[j+2]=v;}
  }else{
    for(let i=0;i<p.length;i+=4){const g=.299*p[i]+.587*p[i+1]+.114*p[i+2];p[i]=p[i+1]=p[i+2]=g;}
  }
  x.putImageData(d,0,0);return c;
}
function ocrWords(data){
  if(data.words&&data.words.length)return data.words;
  const o=[];
  for(const b of data.blocks||[])for(const pa of b.paragraphs||[])for(const l of pa.lines||[])for(const w of l.words||[])o.push(w);
  return o;
}
function ocrExtract(words,imgW){
  const W=words.map(w=>({t:String(w.text||'').trim(),x0:w.bbox.x0,x1:w.bbox.x1,y0:w.bbox.y0,y1:w.bbox.y1})).filter(w=>w.t)
    .map(w=>Object.assign(w,{cx:(w.x0+w.x1)/2,cy:(w.y0+w.y1)/2,h:Math.max(1,w.y1-w.y0)}));
  const codes=W.filter(w=>{const l=w.t.replace(/[^A-Za-z]/g,'').toUpperCase();return l.length===3&&OCR_MAP[l];})
    .map(w=>Object.assign({},w,{code:w.t.replace(/[^A-Za-z]/g,'').toUpperCase()}));
  const NUM=/(\d{1,3}(?:\.\d{3})+|\d+),(\d{2,6})(?!\d)/;
  const sameLine=(o,w)=>Math.abs(o.cy-w.cy)<w.h*0.7;
  const nums=[];
  for(const w of W){
    const m=w.t.match(NUM);if(!m||w.t.indexOf('%')>=0)continue;
    const v=parseNum(m[0]);if(!(v>0))continue;
    const left=W.filter(o=>o!==w&&o.x1<=w.x0+4&&sameLine(o,w)).sort((a,b)=>b.x1-a.x1)[0];
    if(left&&/^%$/.test(left.t)&&w.x0-left.x1<w.h*2.5)continue;
    let lab=w.t.slice(0,m.index).toLowerCase();
    if(!lab&&left)lab=left.t.toLowerCase();
    if(nums.some(o=>o.v===v&&Math.abs(o.cy-w.cy)<w.h&&Math.abs(o.cx-w.cx)<w.h*6))continue;
    nums.push(Object.assign({},w,{v,dec:m[2].length,lab,sat:/^[s5$]?[a@]t\W*$/.test(lab),al:/^a[l1i|!]\W*$/.test(lab)}));
  }
  const by=new Map();
  const offs=imgW*0.068,reach=imgW*0.17;
  for(const n of nums){
    let best=null;
    for(const c of codes){
      if(c.cy>=n.cy)continue;
      const dx=Math.abs(n.cx-(c.x0+offs));if(dx>reach)continue;
      const dy=n.cy-c.cy;if(!best||dy<best.dy)best={c,dy};
    }
    if(!best)continue;
    const k=best.c.code+'@'+Math.round(best.c.x0)+','+Math.round(best.c.y0);
    if(!by.has(k))by.set(k,{code:best.c.code,nums:[]});
    by.get(k).nums.push(n);
  }
  const out={};
  for(const g of by.values()){
    const key=OCR_MAP[g.code];if(out[key])continue;
    g.nums.sort((a,b)=>a.cy-b.cy);
    let pick=g.nums.find(n=>n.sat);
    if(!pick){const big=g.nums.filter(n=>n.dec>=3&&!n.al);const all=g.nums.filter(n=>n.dec>=3);if(all.length>=2)pick=all[1];else if(big.length===1&&all.length===1&&!g.nums.some(n=>n.al))pick=null;}
    if(!pick)continue;
    const ok=g.code==='XAU'?pick.v>100:(pick.v>1&&pick.v<1000);
    if(ok)out[key]=pick.v;
  }
  return out;
}
async function ocrRun(file){
  const tok={type:'ocr'};ui.sheet=tok;
  openSheet('Fiyatlar okunuyor','<p class="small" id="ocr-st">Hazırlanıyor…</p><div class="prog"><i id="ocr-bar" style="width:4%"></i></div><p class="small">Okuma telefonunda yapılır, görsel hiçbir yere gönderilmez. İlk seferde okuma bileşeni internetten indirilir, bu yüzden biraz sürebilir.</p>');
  const live=()=>ui.sheet===tok;
  const st=t=>{const e=$('#ocr-st');if(live()&&e)e.textContent=t;};
  const bar=p=>{const e=$('#ocr-bar');if(live()&&e)e.style.width=Math.max(4,Math.min(100,Math.round(p)))+'%';};
  let found={},worker=null,failed=null;
  try{
    st('Okuma bileşeni yükleniyor…');
    await loadOcrLib();
    const im=await loadImg(file);
    bar(10);
    let base=10,span=45;
    worker=await Tesseract.createWorker('eng',1,{langPath:OCR_LANG,logger:m=>{if(m.status==='recognizing text')bar(base+m.progress*span);}});
    await worker.setParameters({tessedit_pageseg_mode:Tesseract.PSM.SPARSE_TEXT,user_defined_dpi:'300'});
    const passes=['plain','btn'];let all=[],cw=0;
    for(let i=0;i<passes.length;i++){
      if(!live())break;
      st(i===0?'Görseldeki yazılar okunuyor…':'Buton içindeki fiyatlar okunuyor…');
      base=10+i*45;
      const c=prepCanvas(im,passes[i]);
      const r=await worker.recognize(c);
      all=all.concat(ocrWords(r.data));cw=c.width;
      bar(base+span);
    }
    found=ocrExtract(all,cw);
  }catch(e){failed=e;}
  try{if(worker)await worker.terminate();}catch(e){}
  if(!live())return;
  if(failed&&!Object.keys(found).length){
    $('#sheet-title').textContent='Okunamadı';
    $('#sheet-body').innerHTML='<div class="note warn">Görsel okunamadı. İnternet bağlantını kontrol edip tekrar dene. Fiyatları aşağıdaki alanlardan elle de girebilirsin.</div><div class="acts"><button class="btn" data-act="sheet-close">Kapat</button></div>';
    return;
  }
  const keys=Object.keys(found);
  if(!keys.length){
    $('#sheet-title').textContent='Fiyat bulunamadı';
    $('#sheet-body').innerHTML='<div class="note warn">Görselde USD, EUR veya XAU kartlarının “Sat” fiyatları bulunamadı. Görüntüde bu fiyatların net ve kırpılmamış göründüğünden emin olup tekrar dene. Fiyatları elle de girebilirsin.</div><div class="acts"><button class="btn" data-act="sheet-close">Kapat</button></div>';
    return;
  }
  const order=INSTR.map(i=>i.k).filter(k=>found[k]!=null);
  $('#sheet-title').textContent='Okunan fiyatlar';
  $('#sheet-body').innerHTML='<p class="small">Görselden okunan satış fiyatları. Yanlış okunan varsa düzelt, sonra uygula.</p>'+
    order.map(k=>{const old=priceOf(k);return `<div class="fld"><label for="o-${k}">${esc(IB[k].n)}${old?` · şu an ${fmt2(old)} ₺`:''}</label><input type="text" inputmode="decimal" id="o-${k}" data-ocr="${k}" value="${numStr(found[k])}" autocomplete="off"></div>`;}).join('')+
    '<div class="formerr" id="o-err" role="alert"></div><div class="acts"><button class="btn pri" data-act="ocr-apply">Fiyatları uygula</button><button class="btn" data-act="sheet-close">Vazgeç</button></div>';
}

  if(el.matches&&el.matches('[data-price]')){
    const k=el.dataset.price,raw=el.value.trim();
    if(raw==='')delete state.settings.prices[k];
    else{
      const n=parseNum(raw);
      if(!(n>0)){toast('Geçerli bir fiyat gir.','bad');el.value=numStr(state.settings.prices[k]);return;}
      state.settings.prices[k]=n;el.value=numStr(n);
    }
    state.settings.pricesAt=todayStr();
    saveSettings();
  }
});
document.addEventListener('toggle',e=>{if(e.target.id==='pdet')ui.pricesOpen=e.target.open;},true);
document.addEventListener('focusout',e=>{if(pending&&$('#view').contains(e.target))setTimeout(render,60);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});
function route(){const h=location.hash.slice(1);ui.view=['ozet','vadeli','nakit','akis','altin'].indexOf(h)>=0?h:'ozet';}
window.addEventListener('hashchange',()=>{route();render();window.scrollTo(0,0);});

/* ---------- ortak kayıt ---------- */
async function initDb(){
  try{
    if(!(window.claude&&window.claude.use))return;
    const d=await window.claude.use('db');
    if(!d)return;
    db=d;state.mode='shared';state.deposits=[];state.assets=[];state.cash=[];state.flows=[];state.settings=mergeSettings(null);render();
    const ready=()=>{state.ready=true;};
    const onErr=()=>{state.ready=true;state.note='Ortak kayıtlara ulaşılamadı. Gösterilen bilgiler eski olabilir.';render();};
    db.collection('deposits').onSnapshot(s=>{state.deposits=s.docs.map(x=>Object.assign({},x.data(),{id:x.id}));ready();render();},onErr);
    db.collection('assets').onSnapshot(s=>{state.assets=s.docs.map(x=>Object.assign({},x.data(),{id:x.id}));ready();render();},onErr);
    db.collection('flows').onSnapshot(s=>{state.flows=s.docs.map(x=>Object.assign({},x.data(),{id:x.id}));ready();render();},onErr);
    db.collection('cash').onSnapshot(s=>{state.cash=s.docs.map(x=>Object.assign({},x.data(),{id:x.id}));ready();render();},onErr);
    db.doc('settings/main').onSnapshot(s=>{state.settings=mergeSettings(s.exists?s.data():null);ready();render();},onErr);
  }catch(e){db=null;state.mode='local';}
}
function boot(){
  lsLoad();route();render();
  initDb().then(()=>{if(!db){state.ready=true;}render();});
  setTimeout(()=>{if(!state.ready){state.ready=true;state.note='Ortak kayıtlara ulaşılamadı. Gösterilen bilgiler eski olabilir.';render();}},10000);
}
boot();
})();
</script>
